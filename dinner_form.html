<form action="">
  <div>
    <label for="eat">吃爆</label>
    <input type="radio" name="晚餐" id="eat" value="吃" />

    <label for="dont_eat">不餓</label>
    <input type="radio" name="晚餐" id="dont_eat" value="不想吃" />
  </div>

  <div>
    <input type="text" placeholder="吃什麼好呢？" name="晚餐" />
  </div>

  <div>
    <label for="egg">蛋</label>
    <input type="checkbox" name="菜單" id="egg" value="蛋" />
  </div>

  <div>
    <input type="color" name="顏色" value="" />
  </div>

  <div>
    <select name="選吃的" id="food">
      <option value="">請選擇</option>
      <option value="茄子">茄子</option>
      <option value="香蕉">香蕉</option>
      <option value="麵包">麵包</option>
    </select>
  </div>
  <div>
    <input type="reset" />
    <input type="submit" />
  </div>
</form>
