<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>absolute</title>
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <section>
      <div class="card">
        <div class="img-wrap">
          <img
            src="../0422/image/miffy_flower.png"
            alt="米菲看花"
            class="card-img"
          />
        </div>
        <div class="sale">SALE</div>
        <div class="num">6.3折</div>
        <div class="content">
          <h2>米飛兔</h2>
          <p>
            米菲兔（Miffy）最喜歡在陽光燦爛的午後，走進自家花園觀察那些盛開的繽紛花朵。對米菲而言，每一朵花都像是一個可愛的朋友。她總是靜靜地站在花叢旁，用那一雙充滿好奇的眼睛，仔細端詳紅色的鬱金香如何挺拔生長，或是藍色風信子在微風中輕輕搖曳的姿態。
            在迪克·布魯納的繪本世界裡，米菲雖然不多話，但她對自然的熱愛無處不在。看著這些花，米菲的心情總會變得很平靜、很快樂。對她來說，欣賞花朵不只是視覺的享受，更是一場關於生命與色彩的無聲對話。
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
